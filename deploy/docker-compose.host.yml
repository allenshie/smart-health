# 以 host 網路執行 Health App（SPEC §10：部分 Orin 的 kernel 沒有 iptables raw 表，
# Docker bridge 網路無法建立）。host 網路沒有 port 對應，改用 UVICORN_PORT 指定監聽 port。
#   cp config/targets.example.yaml config/targets.yaml   # 填入實際目標；此檔不進版控
#   UVICORN_PORT=8000 docker compose -f deploy/docker-compose.host.yml up -d --build
services:
  health-app:
    image: smart-health-app:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
    network_mode: host
    environment:
      UVICORN_PORT: ${UVICORN_PORT:-8000}
    volumes:
      # config/targets.yaml 不存在時直接失敗，不讓 Docker 自動建立同名目錄
      - type: bind
        source: ../config/targets.yaml
        target: /config/targets.yaml
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
