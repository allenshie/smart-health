[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "smart-health-record"
version = "0.1.0"
description = "通用的服務健康狀態記錄函式庫：節點架構、狀態評估與 /topology、/status HTTP 端點（僅用標準函式庫）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_health_record"]

[tool.pytest.ini_options]
testpaths = ["tests"]
