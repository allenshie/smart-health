# deploy/docker-compose.dev.yml 與 e2e 使用的目標設定（進版控）。
# 只能放模擬服務的位址，也就是 compose service 名稱；真實目標請寫在不進版控的 config/targets.yaml。
poll_interval_s: 1          # e2e 需要快速反映情境切換
request_timeout_s: 1        # hang 目標 1 秒就判定 offline
evaluation_stale_after_s: 5 # mock 每 0.2 秒評估，正常時 evaluation_age_s 遠小於 5
history_limit: 200
targets:
  - id: mock-edge-a
    name: Mock Edge A
    base_url: http://mock-edge-a:18081
  - id: mock-edge-b
    name: Mock Edge B
    base_url: http://mock-edge-b:18081
  - id: mock-api
    name: Mock API
    base_url: http://mock-api:18081
  - id: raw-hang
    name: Raw hang
    base_url: http://raw-hang:18090
  - id: raw-http-500
    name: Raw http_500
    base_url: http://raw-http-500:18090
  - id: raw-invalid-json
    name: Raw invalid_json
    base_url: http://raw-invalid-json:18090
  - id: raw-wrong-schema
    name: Raw wrong_schema
    base_url: http://raw-wrong-schema:18090
  - id: raw-missing-nodes
    name: Raw missing_nodes
    base_url: http://raw-missing-nodes:18090
  - id: raw-topology-change
    name: Raw topology_change
    base_url: http://raw-topology-change:18090
  - id: raw-evaluation-stale
    name: Raw evaluation_stale
    base_url: http://raw-evaluation-stale:18090
