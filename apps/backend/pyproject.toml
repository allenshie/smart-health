[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smart-health-backend"
version = "0.1.0"
description = "智慧倉儲健康監控後端：定期拉取各服務的 /topology 與 /status"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "pydantic>=2.6,<3",
    "httpx>=0.27,<1",
    "uvicorn>=0.29,<1",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "anyio>=4,<5", "jsonschema>=4,<5"]

[tool.hatch.build.targets.wheel]
packages = ["src/smart_health_backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
